<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkter - Vue Bootstrap</title>
  <!-- Tilføj Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between">
      <h1 class="h3">Produkter</h1>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a href="index.html" class="nav-link text-white">Forside</a></li>
          <li class="nav-item"><a href="login.html" class="nav-link text-white">Login</a></li>
          <li class="nav-item"><a href="signup.html" class="nav-link text-white">Signup</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app" class="container mt-4">
    <div class="row">
      <div class="col-12">
        <div class="row">
          <div class="col-md-4" v-for="product in products" :key="product.productId">
            <div class="card mb-4 shadow-sm">
              <img :src="product.imageUrl" class="card-img-top" alt="Product Image">
              <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description }}</p>
                <p class="card-text">{{ product.price | currency }}</p>
                <a href="#" class="btn btn-primary">Køb nu</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    &copy; 2025 Produkter. Alle rettigheder forbeholdes.
  </footer>

  <!-- Import Vue.js and Custom Script -->
  <script src="/MAIN/main.js"></script>

  <!-- Bootstrap JS (for modals, dropdowns, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
